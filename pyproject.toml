[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoxiang-store-analytics"
version = "0.1.0"
description = "Store demand-driver analysis and distance-band order forecasting for a Xiaoxiang Supermarket business case."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
analyze-store-demand-drivers = "xiaoxiang_analytics.cli:analyze_demand_drivers_main"
rank-store-feature-importance = "xiaoxiang_analytics.cli:rank_feature_importance_main"
train-distance-band-forecaster = "xiaoxiang_analytics.cli:train_distance_forecaster_main"
serve-order-prediction-dashboard = "xiaoxiang_analytics.cli:serve_prediction_dashboard_main"

[tool.setuptools.package-data]
xiaoxiang_analytics = ["templates/*.html"]

[tool.setuptools.packages.find]
include = ["xiaoxiang_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
